<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 320" role="img" aria-labelledby="logo-title logo-description">
  <title id="logo-title">ThermalSkinIQ logo</title>
  <desc id="logo-description">ThermalSkinIQ wordmark with orange and blue accents and the tagline Every surface. Every season. Any temperature.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset=".48" stop-color="#dce4e9"/><stop offset="1" stop-color="#aeb8bf"/></linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#ffb43f"/><stop offset="1" stop-color="#ff6d00"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#55e6f4"/><stop offset="1" stop-color="#0077e8"/></linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="17" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1536" height="320" rx="8" fill="#030609"/>
  <ellipse cx="690" cy="142" rx="570" ry="48" fill="#eef7ff" opacity=".1" filter="url(#glow)"/>
  <text x="64" y="176" font-family="Arial, Helvetica, sans-serif" font-size="165" font-weight="700" letter-spacing="-8" fill="url(#metal)">Thermal</text>
  <text x="810" y="176" font-family="Arial, Helvetica, sans-serif" font-size="165" font-weight="700" letter-spacing="-8" fill="url(#orange)">S</text>
  <text x="915" y="176" font-family="Arial, Helvetica, sans-serif" font-size="165" font-weight="700" letter-spacing="-8" fill="url(#blue)">kin</text>
  <text x="1190" y="176" font-family="Arial, Helvetica, sans-serif" font-size="165" font-weight="700" letter-spacing="-8" fill="url(#metal)">IQ</text>
  <text x="1451" y="62" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#f2f5f7">TM</text>
  <rect x="80" y="227" width="112" height="6" rx="3" fill="url(#orange)"/>
  <text x="225" y="245" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="500" letter-spacing="7" fill="#f2f5f7">EVERY SURFACE. EVERY SEASON. ANY TEMPERATURE</text>
  <rect x="1330" y="227" width="124" height="6" rx="3" fill="url(#blue)"/>
</svg>
