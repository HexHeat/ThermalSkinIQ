<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Heated-floor installation material takeoff estimator">
  <title>Tile Install Flowchart | ThermalSkinIQ</title>
  <style>
    :root {
      color-scheme: light;
      font: 16px/1.45 Roboto, "Segoe UI", Arial, sans-serif;
      color: #24232a;
      background: #fff8ff;
    }

    * { box-sizing: border-box; }

    body { margin: 0; background: #fff8ff; }

    header {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 18px max(20px, calc((100% - 760px) / 2));
      background: #ffb84d;
      box-shadow: 0 2px 5px #0002;
    }

    h1 { margin: 0; font-size: clamp(1.7rem, 5vw, 2.2rem); line-height: 1.2; }

    main { width: min(100%, 760px); margin: 0 auto; padding: 20px 16px 36px; }

    .card {
      margin: 18px 0;
      padding: clamp(18px, 4vw, 28px);
      border-radius: 22px;
      background: #f7f1f8;
      box-shadow: 0 3px 7px #0003;
    }

    h2 {
      margin: 0 0 18px;
      padding-bottom: 12px;
      border-bottom: 2px solid #d5ced8;
      color: #617f8c;
      font-size: 1.35rem;
    }

    .fields { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .62fr); gap: 14px; }
    .field { min-width: 0; }
    .field.manufacturer { grid-column: 1; }
    .field.substrate { grid-column: 2; }
    .field.primer-size { grid-column: 1; }
    .field[hidden] { display: none; }

    label { display: block; margin: 0 0 7px; color: #55515b; font-size: .95rem; }

    select, input {
      width: 100%;
      min-height: 62px;
      padding: 12px 14px;
      border: 2px solid #89848d;
      border-radius: 9px;
      background: #fffaff;
      color: inherit;
      font: inherit;
      font-size: 1.1rem;
    }

    select:focus, input:focus, button:focus-visible, a:focus-visible {
      outline: 3px solid #7460ad;
      outline-offset: 2px;
    }

    .area-input { position: relative; }
    .area-input input { padding-right: 58px; }
    .area-input::after {
      content: "sq. ft.";
      position: absolute;
      top: 50%;
      right: 16px;
      transform: translateY(-50%);
      color: #55515b;
      pointer-events: none;
    }

    button {
      width: 100%;
      min-height: 68px;
      margin: 10px 0 18px;
      border: 0;
      border-radius: 40px;
      background: #ff9800;
      color: white;
      font: inherit;
      font-size: 1.3rem;
      font-weight: 750;
      cursor: pointer;
      box-shadow: 0 3px 5px #0003;
    }

    button:hover { background: #eb8900; }
    .error { margin: 0 0 14px; color: #a32121; font-weight: 650; }

    .result {
      padding: clamp(18px, 4vw, 30px);
      border: 4px solid #299ce8;
      border-radius: 18px;
      background: #e4f2ff;
    }

    .result[hidden], .error[hidden] { display: none; }

    .result h2 {
      margin: 0;
      padding: 0;
      border: 0;
      color: #299ce8;
      text-align: center;
      font-size: 1.8rem;
    }

    .waste-note {
      margin: 4px 0 18px;
      padding-bottom: 14px;
      border-bottom: 2px solid #55b3ee;
      color: #617f8c;
      text-align: center;
      font-size: 1.1rem;
      font-style: italic;
    }

    .takeoff-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 14px;
      align-items: center;
      padding: 18px 0;
      border-bottom: 2px solid #c8dce8;
    }

    .takeoff-row:last-of-type { border-bottom: 0; }
    .row-title { grid-column: 1 / -1; margin: 0; font-size: 1.2rem; font-weight: 750; }
    .product { margin: 0; color: #617f8c; font-size: 1.12rem; }
    .quantity { margin: 0; color: #4caf50; font-size: clamp(1.35rem, 5vw, 2rem); font-weight: 750; white-space: nowrap; }
    .detail { grid-column: 1 / -1; margin: -4px 0 0; font-style: italic; }
    .warning { margin: 18px 0 0; color: #617f8c; font-size: 1.08rem; font-style: italic; }
    .footnote { margin: 14px 0 0; color: #52616b; font-size: .88rem; }

    @media (max-width: 430px) {
      .fields { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      select, input { min-height: 58px; padding: 10px; font-size: 1rem; }
      .quantity { font-size: 1.35rem; }
      .result h2 { font-size: 1.55rem; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Tile Install Flowchart</h1>
  </header>
  <main>
    <form id="takeoff-form" novalidate>
      <section class="card" aria-labelledby="materials-heading">
        <h2 id="materials-heading">Step 1: Installation Details</h2>
        <div class="fields">
          <div class="field manufacturer">
            <label for="manufacturer">Chemical Manufacturer</label>
            <select id="manufacturer" name="manufacturer">
              <option value="Laticrete">Laticrete</option>
              <option value="Mapei">Mapei</option>
              <optgroup label="Coming soon">
                <option value="Ardex" disabled>Ardex (Coming soon)</option>
                <option value="Schluter" disabled>Schluter (Coming soon)</option>
                <option value="Custom" disabled>Custom (Coming soon)</option>
                <option value="TEC" disabled>TEC (Coming soon)</option>
              </optgroup>
            </select>
          </div>
          <div class="field substrate">
            <label for="substrate">Substrate</label>
            <select id="substrate" name="substrate">
              <option value="Concrete">Concrete</option>
              <option value="Wood / Plywood">Wood / Plywood</option>
            </select>
          </div>
          <div class="field primer-size" id="primer-size-field" hidden>
            <label for="primer-size">Mapei Primer Container Size</label>
            <select id="primer-size" name="primer-size">
              <option value="225">1 gallon (225 sq. ft. per container)</option>
              <option value="787">3.5 gallons (787 sq. ft. per container)</option>
            </select>
          </div>
        </div>
      </section>

      <section class="card" aria-labelledby="dimensions-heading">
        <h2 id="dimensions-heading">Step 2: Dimensions</h2>
        <div class="fields">
          <div class="field area">
            <label for="floor-area">Total Floor Area (Sq.Ft.)</label>
            <div class="area-input">
              <input id="floor-area" name="floor-area" type="number" min="0.01" step="any" inputmode="decimal" required>
            </div>
          </div>
          <div class="field area">
            <label for="heated-area">Heated Area (Sq.Ft.)</label>
            <div class="area-input">
              <input id="heated-area" name="heated-area" type="number" min="0.01" step="any" inputmode="decimal" required>
            </div>
          </div>
        </div>
      </section>

      <button type="submit">▦ &nbsp; CALCULATE TAKEOFF</button>
      <p class="error" id="error" role="alert" hidden></p>
    </form>

    <section class="result" id="result" aria-labelledby="result-heading" aria-live="polite" hidden>
      <h2 id="result-heading">MATERIAL TAKEOFF</h2>
      <p class="waste-note">Includes a standard 10% waste factor</p>
      <div id="takeoff-details"></div>
      <p class="footnote">Estimate only. Confirm product coverage and substrate suitability with current manufacturer instructions before ordering or installation.</p>
    </section>

  </main>
  <script>
    const materialSystems = {
      Laticrete: {
        thinset: 'Laticrete Platinum 254',
        thinsetCoverageSqFt: 110,
        primer: 'Laticrete Prime + Bond (3.5-gallon pail)',
        primerCoverageSqFt: 525,
        leveler: 'Laticrete NXT Level+ at 3/8 in.',
        levelerCoverageSqFt: 16.3,
        levelerPackage: 'Pail(s)',
      },
      Mapei: {
        thinset: 'Mapei Keraflex Super',
        thinsetCoverageSqFt: 120,
        leveler: 'Mapei Self Leveler Plus at 3/8 in.',
        levelerCoverageSqFt: 16,
        levelerPackage: 'Bag(s)',
      },
    };
    const wasteMultiplier = 1.1;
    const form = document.getElementById('takeoff-form');
    const manufacturer = document.getElementById('manufacturer');
    const primerSize = document.getElementById('primer-size');
    const primerSizeField = document.getElementById('primer-size-field');
    const result = document.getElementById('result');
    const details = document.getElementById('takeoff-details');
    const error = document.getElementById('error');

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text) node.textContent = text;
      return node;
    }

    function addRow(title, product, quantity, detail) {
      const row = element('div', 'takeoff-row');
      row.append(element('h3', 'row-title', title));
      row.append(element('p', 'product', product));
      row.append(element('p', 'quantity', quantity));
      if (detail) row.append(element('p', 'detail', detail));
      details.append(row);
    }

    function syncManufacturerOptions() {
      primerSizeField.hidden = manufacturer.value !== 'Mapei';
    }

    function clearResult() {
      result.hidden = true;
      details.replaceChildren();
      error.hidden = true;
      error.textContent = '';
    }

    manufacturer.addEventListener('change', syncManufacturerOptions);
    form.addEventListener('input', clearResult);
    form.addEventListener('change', clearResult);

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      clearResult();

      const floorArea = Number(document.getElementById('floor-area').value);
      const heatedArea = Number(document.getElementById('heated-area').value);
      if (!Number.isFinite(floorArea) || floorArea <= 0 || !Number.isFinite(heatedArea) || heatedArea <= 0) {
        error.textContent = 'Enter floor and heated areas greater than zero to calculate the takeoff.';
        error.hidden = false;
        document.getElementById('floor-area').focus();
        return;
      }

      if (heatedArea > floorArea) {
        error.textContent = 'Heated area cannot be greater than total floor area.';
        error.hidden = false;
        document.getElementById('heated-area').focus();
        return;
      }

      const materials = materialSystems[manufacturer.value];
      let primer = {
        product: materials.primer,
        coverageSqFt: materials.primerCoverageSqFt,
        package: 'Pail(s)',
      };
      if (manufacturer.value === 'Mapei') {
        const primerCoverageSqFt = Number(primerSize.value);
        // Workbook O20 divides thinset bags by primer coverage; use heater area instead.
        primer = {
          product: primerCoverageSqFt === 225
            ? 'Mapei Eco Prim Grip (1-gallon container)'
            : 'Mapei Eco Prim Grip (3.5-gallon pail)',
          coverageSqFt: primerCoverageSqFt,
          package: 'Container(s)',
        };
      }

      const thinsetBags = Math.ceil((heatedArea * wasteMultiplier) / materials.thinsetCoverageSqFt);
      const primerPackages = Math.ceil((heatedArea * wasteMultiplier) / primer.coverageSqFt);
      const levelerPackages = Math.ceil((floorArea * wasteMultiplier) / materials.levelerCoverageSqFt);
      if (![thinsetBags, primerPackages, levelerPackages].every(Number.isSafeInteger)) {
        error.textContent = 'The entered areas are too large to calculate safely. Enter smaller areas.';
        error.hidden = false;
        document.getElementById('floor-area').focus();
        return;
      }

      const substrate = document.getElementById('substrate').value;
      addRow('Heater-Bond Thinset Required:', materials.thinset, `${thinsetBags} Bag(s)`, `For ${heatedArea} sq. ft. of heaters`);
      addRow('Primer Required:', primer.product, `${primerPackages} ${primer.package}`, `For ${heatedArea} sq. ft. on ${substrate}`);
      addRow('Self-Leveler Required:', materials.leveler, `${levelerPackages} ${materials.levelerPackage}`, `For ${floorArea} sq. ft. at 3/8 in.`);

      result.hidden = false;
    });

    syncManufacturerOptions();
  </script>
</body>
</html>
